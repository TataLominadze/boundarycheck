[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boundarycheck"
version = "0.1.0.dev0"
description = "An infrastructure security tool for checking network and service boundaries."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["boundarycheck*"]

[project.scripts]
boundarycheck = "boundarycheck.cli:main"
